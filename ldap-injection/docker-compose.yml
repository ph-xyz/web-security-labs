services:
  ldap:
    image: osixia/openldap:1.5.0
    container_name: ldap-lab
    command: ["--copy-service"]
    environment:
      LDAP_ORGANISATION: "Lab"
      LDAP_DOMAIN: "lab.local"
      LDAP_ADMIN_PASSWORD: "admin"
    volumes:
      - ./users.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/users.ldif:ro
    ports:
      - "389:389"

  app:
    build: .
    container_name: ldap-app
    depends_on:
      - ldap
    ports:
      - "5000:5000"
